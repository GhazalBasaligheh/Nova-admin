<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>NOVA Admin</title>
    <script>
      // Apply stored theme and language before first paint (no flash). Keys match src/Storage/preferences.ts.
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem('nova-admin-theme');
          var lang = localStorage.getItem('nova-admin-language');
          root.dataset.theme = theme === 'dark' ? 'dark' : 'light';
          if (lang === 'en') {
            root.lang = 'en';
            root.dir = 'ltr';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
